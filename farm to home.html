<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farm To Home – Orders</title>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;

    background: 
      linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
      url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") 
      no-repeat center center fixed;

    background-size: cover;
    min-height: 100vh;
    color: white;
  }

  h1 {
    font-size: 40px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
  }

  p { color: #e6fffa; font-weight: bold; }

  button {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 12px 22px;
    margin: 10px;
    font-size: 16px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    transform: translateY(-2px);
    background: linear-gradient(90deg, #16a34a, #15803d);
  }

  input, select {
    display: block;
    margin: 12px auto;
    padding: 13px;
    width: 85%;
    max-width: 340px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.9);
  }

  .hidden { display: none; }

  ul { list-style: none; padding: 0; }

  li {
    background: rgba(255,255,255,0.92);
    margin: 14px auto;
    padding: 18px;
    max-width: 460px;
    border-radius: 18px;
    text-align: left;
    color: black;
  }

  .location {
    color: black;
    background: rgba(255,255,255,0.85);
    padding: 12px;
    border-radius: 14px;
    max-width: 460px;
    margin: 12px auto;
    text-align: left;
  }

  .success { color: #bbf7d0; font-weight: bold; }
</style>
</head>

<body>

<h1>🌱 FARM TO HOME 🏡</h1>
<p>WHERE FARMERS GROW WITH LOVE & FAMILIES EAT WITH TRUST</p>

<div id="home">
  <button onclick="showFarmer()">👨‍🌾 Farmer</button>
  <button onclick="showCustomer()">🏠 Customer</button>
</div>

<!-- FARMER -->
<div id="farmer" class="hidden">
  <h2>👨‍🌾 Farmer Details</h2>
  <p>your hard work feeds families💖</p>

  <input id="farmerName" placeholder="Farmer Name">
  <input id="farmerPhone" type="tel" placeholder="Phone Number"
         maxlength="10"
         oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);">

  <input id="crop" placeholder="Crop Name">
  <input id="quantity" type="number" placeholder="Quantity (kg)">
  <input id="price" type="number" placeholder="Price per kg (₹)">
  <input id="farmerPIN" placeholder="Farm PIN Code">
  <button onclick="lookupFarmerPIN()">🔍 Lookup PIN</button>

  <select id="farmerVillage" class="hidden"></select>
  <div id="farmerLocation" class="location"></div>

  <button onclick="addProduce()">➕ Add Produce</button>
  <p id="farmerMsg" class="success"></p>

  <hr>

  <button onclick="showOrders()">📩 View Orders Received</button>
  <ul id="ordersList"></ul>

  <button onclick="goHome()">⬅ Back</button>
</div>

<!-- CUSTOMER -->
<div id="customer" class="hidden">
  <h2>🏠 Customer Details</h2>
  <p>🕊️Straight from farmer's heart to your home💗</p>

  <input id="customerName" placeholder="Your Name">
  <input id="customerPhone" type="tel" placeholder="Phone Number"
         maxlength="10"
         oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);">

  <input id="customerPIN" placeholder="Delivery PIN Code">
  <button onclick="lookupCustomerPIN()">🔍 Lookup PIN</button>

  <select id="customerVillage" class="hidden"></select>
  <div id="customerLocation" class="location"></div>

  <input id="searchProduct" placeholder="Search product" oninput="displayProduce()">
  <h3>🛒 Produce within 100 km</h3>
  <ul id="produceList"></ul>

  <button onclick="goHome()">⬅ Back</button>
</div>

<script>
let produce = JSON.parse(localStorage.getItem("produce")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];

let farmerCoords = null;
let customerCoords = null;
let farmerVillageSelected = "";
let customerVillageSelected = "";

function saveData(){
  localStorage.setItem("produce", JSON.stringify(produce));
  localStorage.setItem("orders", JSON.stringify(orders));
}

function hideAll(){
  home.classList.add("hidden");
  farmer.classList.add("hidden");
  customer.classList.add("hidden");
}
function showFarmer(){ hideAll(); farmer.classList.remove("hidden"); }
function showCustomer(){ hideAll(); customer.classList.remove("hidden"); }
function goHome(){ hideAll(); home.classList.remove("hidden"); }

async function getPinDetails(pin){
  const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
  const data = await res.json();
  if(data[0].Status !== "Success") return null;
  const offices = data[0].PostOffice;
  return {
    villages: offices.map(o => o.Name),
    district: offices[0].District,
    state: offices[0].State
  };
}

async function pinToCoords(pin){
  const res = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${pin},India`
  );
  const data = await res.json();
  if(!data.length) return null;
  return { lat: +data[0].lat, lng: +data[0].lon };
}

function populateVillageSelect(selectEl, villages){
  selectEl.innerHTML = `<option value="">Select Village</option>`;
  villages.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
  selectEl.classList.remove("hidden");
}

async function lookupFarmerPIN(){
  const pin = farmerPIN.value;
  if(!/^[1-9][0-9]{5}$/.test(pin)) return alert("Enter valid PIN");

  const details = await getPinDetails(pin);
  const coords = await pinToCoords(pin);
  if(!details || !coords) return alert("PIN not found");

  farmerCoords = coords;
  populateVillageSelect(farmerVillage, details.villages);

  farmerVillage.onchange = () => {
    farmerVillageSelected = farmerVillage.value;
    if(farmerVillageSelected){
      farmerLocation.innerHTML =
        `<b>📍 ${farmerVillageSelected}</b><br>
         ${details.district}, ${details.state}`;
    }
  };
}

async function lookupCustomerPIN(){
  const pin = customerPIN.value;
  if(!/^[1-9][0-9]{5}$/.test(pin)) return alert("Enter valid PIN");

  const details = await getPinDetails(pin);
  const coords = await pinToCoords(pin);
  if(!details || !coords) return alert("PIN not found");

  customerCoords = coords;
  populateVillageSelect(customerVillage, details.villages);

  customerVillage.onchange = () => {
    customerVillageSelected = customerVillage.value;
    if(customerVillageSelected){
      customerLocation.innerHTML =
        `<b>📍 ${customerVillageSelected}</b><br>
         ${details.district}, ${details.state}`;
      displayProduce();
    }
  };
}

function addProduce(){
  if(!farmerName.value || !farmerPhone.value ||
     !crop.value || !quantity.value || !price.value)
    return alert("Fill all fields");

  if(farmerPhone.value.length !== 10)
    return alert("Phone must be 10 digits");

  if(!farmerCoords || !farmerVillageSelected)
    return alert("Select village");

  produce.push({
    farmerName: farmerName.value,
    farmerPhone: farmerPhone.value,
    crop: crop.value,
    quantity: +quantity.value,
    price: +price.value,
    coords: farmerCoords,
    village: farmerVillageSelected
  });

  saveData();
  farmerMsg.innerText = "✅ Produce Added!";
}

function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calculateDeliveryCharge(distance){
  if(distance <= 10) return 0;
  return Math.ceil(distance - 10) * 10;
}

function displayProduce(){
  produceList.innerHTML = "";
  if(!customerCoords || !customerVillageSelected){
    produceList.innerHTML = "<li>Select delivery village</li>";
    return;
  }

  const search = searchProduct.value.toLowerCase();

  produce.forEach((item,i)=>{
    const dist = distanceKm(
      customerCoords.lat, customerCoords.lng,
      item.coords.lat, item.coords.lng
    );

    if(dist <= 100 && item.crop.toLowerCase().includes(search) && item.quantity > 0){
      const delivery = calculateDeliveryCharge(dist);
      const li = document.createElement("li");
      li.innerHTML = `
        🌾 <b>${item.crop}</b><br>
        👨‍🌾 ${item.farmerName}<br>
        📍 ${item.village}<br>
        ₹${item.price}/kg<br>
        ${item.quantity} kg<br>
        Distance: ${dist.toFixed(1)} km<br>
        Delivery: ₹${delivery}<br><br>
        <input type="number" min="1" max="${item.quantity}" id="q${i}" placeholder="Quantity">
        <button onclick="placeOrder(${i},${dist})">Place Order</button>
      `;
      produceList.appendChild(li);
    }
  });

  if(produceList.innerHTML.trim() === "")
    produceList.innerHTML = "<li>No produce found in 100 km</li>";
}

function placeOrder(i, dist){
  const qty = +document.getElementById(`q${i}`).value;
  if(!qty) return alert("Enter quantity");

  if(qty > produce[i].quantity)
    return alert(`Only ${produce[i].quantity} kg available`);

  if(!customerName.value || !customerPhone.value)
    return alert("Enter customer details");

  const delivery = calculateDeliveryCharge(dist);
  const total = qty * produce[i].price + delivery;

  orders.push({
    crop: produce[i].crop,
    fromVillage: produce[i].village,
    farmerName: produce[i].farmerName,
    farmerPhone: produce[i].farmerPhone,
    customerName: customerName.value,
    customerPhone: customerPhone.value,
    customerVillage: customerVillageSelected,
    qty, deliveryCharge: delivery, total
  });

  produce[i].quantity -= qty;
  saveData();

  alert(`✅ Order Confirmed

🌾 Crop: ${produce[i].crop}
📍 From: ${produce[i].village}

👨‍🌾 Farmer Name: ${produce[i].farmerName}
📞 Farmer Phone: ${produce[i].farmerPhone}

🏠 Customer Name: ${customerName.value}
📞 Customer Phone: ${customerPhone.value}
📍 Delivery: ${customerVillageSelected}

📦 Quantity: ${qty} kg
🚚 Delivery Charge: ₹${delivery}
💰 Total: ₹${total}

📩 your order is on the way.
`);

  displayProduce();
}

function showOrders(){
  ordersList.innerHTML = "";
  const farmerPhoneVal = farmerPhone.value;

  const myOrders = orders.filter(o => o.farmerPhone === farmerPhoneVal);

  if(myOrders.length === 0){
    ordersList.innerHTML = "<li>No orders yet</li>";
    return;
  }

  myOrders.forEach((o,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `
      <b>Order #${i+1}</b><br>
      🌾 ${o.crop}<br>
      Customer: ${o.customerName}<br>
      Phone: ${o.customerPhone}<br>
      Village: ${o.customerVillage}<br>
      Qty: ${o.qty} kg<br>
      Delivery: ₹${o.deliveryCharge}<br>
      Total: ₹${o.total}
    `;
    ordersList.appendChild(li);
  });
}
</script>

</body>
</html>
